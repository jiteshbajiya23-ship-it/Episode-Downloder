<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ file_name }} | {{ site_name }}</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root { --bg:#0b0b12; --card:#14141f; --text:#f2f2f7; --muted:#9a9ab0; --accent1:#ec4899; --accent2:#8b5cf6; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; min-height:100vh; display:flex; flex-direction:column; }
    header { padding:14px 18px; background:var(--card); border-bottom:1px solid #23233a; }
    header a { text-decoration:none; font-weight:700; font-size:20px;
      background:linear-gradient(90deg,var(--accent1),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    main { flex:1; display:flex; align-items:center; justify-content:center; padding:18px; }
    .card { background:var(--card); border:1px solid #23233a; border-radius:16px; padding:26px 22px; width:100%; max-width:420px; text-align:center; }
    h1 { font-size:16px; font-weight:600; word-break:break-word; margin-bottom:8px; }
    .size { color:var(--muted); font-size:14px; margin-bottom:20px; }
    .btn { display:block; border-radius:10px; padding:13px 20px; font-size:16px; font-weight:700; color:#fff; text-decoration:none;
      background:linear-gradient(90deg,var(--accent1),var(--accent2)); }
    footer { text-align:center; padding:16px; color:var(--muted); font-size:12px; border-top:1px solid #23233a; }
    footer a { color:var(--text); text-decoration:none; font-weight:600; }
  </style>
</head>
<body>
  <header><a href="{{ website_url }}" target="_blank" rel="noopener">{{ site_name }}</a></header>
  <main>
    <div class="card">
      <h1>{{ file_name }}</h1>
      <p class="size">Size: {{ file_size }}</p>
      <a class="btn" href="{{ file_url }}" download>Download</a>
    </div>
  </main>
  <footer>
    &copy; <script>document.write(new Date().getFullYear())</script>
    <a href="{{ website_url }}" target="_blank" rel="noopener">{{ site_name }}</a>
  </footer>
</body>
</html>
